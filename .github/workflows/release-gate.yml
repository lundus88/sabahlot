name: SabahLot Release Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Production build
        run: npm run build

      - name: Execute all TypeScript QA suites
        shell: pwsh
        run: ./scripts/ai/run-all-qa.ps1

      - name: Browser regression QA
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3100 > /tmp/sabahlot-next.log 2>&1 &
          NEXT_PID=$!

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner"
            exit 1
          fi

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-port=9223 \
            about:blank > /tmp/sabahlot-chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" "$NEXT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null

          SABAHLOT_QA_URL=http://127.0.0.1:3100 \
          SABAHLOT_CDP_URL=http://127.0.0.1:9223 \
          node src/lib/preliminary-record.browser.qa.mjs

      - name: Release gate summary
        if: always()
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "TypeScript + ESLint + build + all *.qa.ts/*.qa.tsx + browser QA are required for a green job."

  public-surface-security:
    if: github.event_name == 'workflow_dispatch'
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dev
            url_secret: SABAHLOT_DEV_SUPABASE_URL
            key_secret: SABAHLOT_DEV_PUBLISHABLE_KEY
            eligible_secret: SABAHLOT_DEV_SECURITY_ELIGIBLE_LISTING_ID
            inactive_secret: SABAHLOT_DEV_SECURITY_INACTIVE_LISTING_ID
            expired_secret: SABAHLOT_DEV_SECURITY_EXPIRED_LISTING_ID
            no_consent_secret: SABAHLOT_DEV_SECURITY_NO_CONSENT_LISTING_ID
            attested_secret: SABAHLOT_DEV_SECURITY_FIXTURE_ATTESTED_AT
          - target: production
            url_secret: SABAHLOT_PROD_SUPABASE_URL
            key_secret: SABAHLOT_PROD_PUBLISHABLE_KEY
            eligible_secret: SABAHLOT_PROD_SECURITY_ELIGIBLE_LISTING_ID
            inactive_secret: SABAHLOT_PROD_SECURITY_INACTIVE_LISTING_ID
            expired_secret: SABAHLOT_PROD_SECURITY_EXPIRED_LISTING_ID
            no_consent_secret: SABAHLOT_PROD_SECURITY_NO_CONSENT_LISTING_ID
            attested_secret: SABAHLOT_PROD_SECURITY_FIXTURE_ATTESTED_AT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Anonymous public-surface negative regression
        env:
          SABAHLOT_SECURITY_TARGET_NAME: ${{ matrix.target }}
          SABAHLOT_SECURITY_SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
          SABAHLOT_SECURITY_PUBLISHABLE_KEY: ${{ secrets[matrix.key_secret] }}
          SABAHLOT_SECURITY_ELIGIBLE_LISTING_ID: ${{ secrets[matrix.eligible_secret] }}
          SABAHLOT_SECURITY_INACTIVE_LISTING_ID: ${{ secrets[matrix.inactive_secret] }}
          SABAHLOT_SECURITY_EXPIRED_LISTING_ID: ${{ secrets[matrix.expired_secret] }}
          SABAHLOT_SECURITY_NO_CONSENT_LISTING_ID: ${{ secrets[matrix.no_consent_secret] }}
          SABAHLOT_SECURITY_FIXTURE_ATTESTED_AT: ${{ secrets[matrix.attested_secret] }}
        run: node scripts/security/public-surface-negative.mjs

      - name: Security gate summary
        if: always()
        run: |
          echo "Target: ${{ matrix.target }}"
          echo "Read-only anonymous REST/RPC regression must pass; missing or stale fixture configuration fails closed."
