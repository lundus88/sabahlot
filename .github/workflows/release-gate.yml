name: SabahLot Release Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# TEMPORARY PR #68 write permission. Removed immediately after the two
# long-form state files are reconciled; final release-gate head returns to
# contents: read before merge.
permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Production build
        run: npm run build

      - name: Execute all TypeScript QA suites
        shell: pwsh
        run: ./scripts/ai/run-all-qa.ps1

      - name: Browser regression QA
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3100 > /tmp/sabahlot-next.log 2>&1 &
          NEXT_PID=$!

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner"
            exit 1
          fi

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-port=9223 \
            about:blank > /tmp/sabahlot-chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" "$NEXT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null

          SABAHLOT_QA_URL=http://127.0.0.1:3100 \
          SABAHLOT_CDP_URL=http://127.0.0.1:9223 \
          node src/lib/preliminary-record.browser.qa.mjs

      - name: Reconcile authoritative long-form state docs (PR 68 only, temporary)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 68 && github.head_ref == 'release-gate-2026-09-03'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          branch = os.environ["GH_BRANCH"]
          marker = "<!-- release-gate-reconciliation-2026-09-03 -->"

          project_block = r'''<!-- release-gate-reconciliation-2026-09-03 -->
          _Current reconciliation: 2026-09-03, PR #68 release-gate pass (pre-merge). Historical narrative below is retained unchanged apart from relabelling its old "Last updated" line as historical._

          ## 2026-09-03 current release-gate reconciliation

          - **Release posture:** Controlled Alpha remains the authoritative product state. Vercel Production hosting for `alpha.sabahlot.com` is not by itself approval for broad public launch.
          - **Main checkpoint before PR #68:** `main@2104f0e6ebf58b4399913e11060271d688f6f747` (PR #67).
          - **Account-isolation incident closure:** PR #64 reset contaminated account-local state; PR #65 removed the unscoped `sessionStorage` GPS-target fallback; PR #66 added a fail-closed global account-session boundary with hard reload on identity change; PR #67 introduced the v3 clean-reset namespace so previously contaminated v1/v2 archives are never auto-restored. Owner real-device A -> B -> A testing after the v3 reset confirmed account-local data and GPS target isolation on the same phone/browser.
          - **Fresh automated release evidence:** GitHub Actions `SabahLot Release Gate` run #8 at PR head `59ed473507a5125f7f8bb4ccde2d4d2182586eb3` completed **SUCCESS**: TypeScript PASS; ESLint 0 errors / 33 warnings; production build PASS; full QA runner **24/24 PASS**; browser regression PASS through current `Menu -> CategoryDrawer -> Land Management` flow and the full wizard, including Save -> reload -> Load, mobile drawer/layout checks, and the assertion that heir/applicant data does not leak into map text.
          - **Browser-harness correction evidence:** the earlier red browser runs were traced to stale selectors/labels/wizard assumptions and, finally, to the test fixture calling `localStorage.clear()`, which deliberately triggered v3 legacy quarantine. The fixture now preserves the established v3 active-owner marker and clears only the known working keys. The subsequent green run demonstrates both the browser flow and the v3 quarantine contract rather than bypassing it.
          - **Cloud authority:** Controlled Alpha exact-host writes remain scoped to `sabahlot-dev`. All `sabahlot-production` write gates remain closed/fail-closed. PR #68 does not authorize or modify Production database write authority.
          - **Public launch:** PR #68 is a software release-evidence/documentation gate. Merge approval does not itself open `sabahlot-production` writes or convert Vercel Production hosting into broad-public-release approval; those remain separate owner-controlled decisions.
          '''

          module_block = r'''<!-- release-gate-reconciliation-2026-09-03 -->
          _Current reconciliation: 2026-09-03, PR #68 release-gate pass (pre-merge). Use this block as the current module truth where older historical rows below conflict; the historical narrative is intentionally retained._

          ## 2026-09-03 current module checkpoint

          | Module / gate | Current state |
          | --- | --- |
          | Authentication / account boundary | **PASS.** PR #66 enforces fail-closed session reconciliation and hard reload on identity changes; PR #67 v3 clean-reset prevents contaminated v1/v2 archives from being auto-restored. |
          | Device-local lot/draft isolation | **PASS.** PR #64 reset contaminated account-local state; owner same-device A -> B -> A verification after PR #67 confirmed account separation. |
          | GPS target isolation | **PASS.** PR #65 removed the unscoped `sessionStorage` fallback; `gpsTargetMemory.qa.ts` passes in the fresh 24-suite release run. |
          | Local Save / reload / Load | **PASS in fresh browser regression.** Current wizard flow completes through Review & Save, persists locally, reloads, loads, and reproduces the entered fields. |
          | Mobile lot drawer / wizard | **PASS in fresh browser regression.** CategoryDrawer -> Land Management opens correctly; drawer remains within viewport, scrollable, Save is visible/enabled, and map remains visible. |
          | Full TypeScript QA | **24/24 PASS** in Release Gate run #8 on PR head `59ed473507a5125f7f8bb4ccde2d4d2182586eb3`. |
          | TypeScript / build | **PASS.** `tsc --noEmit` and optimized production build both succeed in Release Gate run #8. |
          | ESLint | **PASS with warnings:** 0 errors / 33 warnings. Warnings remain technical debt, not release-gate errors. |
          | Security dependency scan | `npm ci` audit reports **0 vulnerabilities** in the release run. |
          | Controlled Alpha cloud writes | Remain constrained to exact `sabahlot-dev` target under the approved guard. |
          | `sabahlot-production` writes | **CLOSED / fail-closed.** No PR #68 change opens these gates. |
          | Broad public launch | **Separate owner-controlled gate.** A green PR #68 validates code/test/docs readiness; it does not itself authorize Production DB writes or mass-public release. |
          '''

          def api_request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "sabahlot-release-gate-doc-reconciler",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def reconcile(path, block):
              encoded_path = urllib.parse.quote(path, safe="/")
              url = f"https://api.github.com/repos/{repo}/contents/{encoded_path}?ref={urllib.parse.quote(branch)}"
              current = api_request(url)
              text = base64.b64decode(current["content"]).decode("utf-8")
              if marker in text:
                  print(f"{path}: reconciliation marker already present")
                  return

              first_line, separator, rest = text.partition("\n")
              if not separator or not first_line.startswith("# "):
                  raise RuntimeError(f"{path}: unexpected document header")

              rest = rest.replace(
                  "\n_Last updated:",
                  "\n_Historical narrative retained from prior entry:",
                  1,
              )
              next_text = first_line + "\n\n" + block.strip() + "\n" + rest
              payload = {
                  "message": f"docs(ai): reconcile {path.split('/')[-1]} for PR 68 release gate",
                  "content": base64.b64encode(next_text.encode("utf-8")).decode("ascii"),
                  "sha": current["sha"],
                  "branch": branch,
              }
              api_request(url.split("?", 1)[0], method="PUT", payload=payload)
              print(f"{path}: reconciled")

          reconcile("docs/ai/PROJECT_STATE.md", project_block)
          reconcile("docs/ai/MODULE_STATUS.md", module_block)
          PY

      - name: Release gate summary
        if: always()
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "TypeScript + ESLint + build + all *.qa.ts/*.qa.tsx + browser QA are required for a green job."
